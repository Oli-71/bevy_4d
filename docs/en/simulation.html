<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="../"> <!-- WASM-App needs to find assets relative to this path -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="keywords" content="bevy, rust, webassembly, 4d, physics-simulation, quantum-mechanics, Bell-inequality, non-locality, hyperspace, wormhole" />
    <title>GroundTruthCAD</title>
    <link rel="stylesheet" href="css/style-wasm.css">
  </head>
  <body>
    <nav class="link-row">
      <a href="index.html">
        <img src="res/back.png" alt="Back">back to start page
      </a>      
    </nav>
    <main class="container">
	  <div class="loader" aria-hidden="true"></div>
	  <!-- Canvas für die WASM-App -->
	  <canvas id="bevy-canvas" class="wasm-canvas" aria-label="bevy 4d canvas"></canvas>
    </main>

    <script type="module">
      import init from '../out/bevy_4d.js'; // ignores <base> tag, so we need to use relative path
      const loader = document.querySelector('.loader');
      
      init().then(() => {
          const container = document.querySelector('.container');
          const wasmCanvas = document.querySelector('canvas:not(#bevy-canvas)');
          const placeholder = document.getElementById('bevy-canvas');
          if (wasmCanvas && container) {
            // HIER AKTIVIERT: Wir zwingen das neue Canvas in unsere CSS-Klasse
            wasmCanvas.classList.add('wasm-canvas');
            container.appendChild(wasmCanvas);
            placeholder?.remove();
          } else if (placeholder) {
            placeholder.classList.add('wasm-canvas');
          }
          loader?.remove();
      }).catch(() => loader?.remove());
    </script>
  </body>
</html>
